# PyCommander Keybindings Configuration (Vim preset)

[navigation]
j = cursor_down
k = cursor_up
h = go_parent_dir
l = open_selected
g g = go_home
shift+g = go_end
tab = switch_pane
enter = open_selected

[actions]
v = toggle_selection
d d = delete_items
y y = copy_items
p = move_items
/ = quick_filter
q = quit_app

[function_keys]
f1 = show_help
f3 = view_file
f5 = copy_items
f6 = move_items
f7 = make_directory
f8 = delete_items
f10 = quit_app
