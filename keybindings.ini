# PyCommander Keybindings Configuration (Norton Commander preset)

[navigation]
up = cursor_up
down = cursor_down
left = cursor_left
right = cursor_right
pageup = page_up
pagedown = page_down
home = go_home
end = go_end
tab = switch_pane
enter = open_selected
backspace = go_parent_dir

[function_keys]
f1 = show_help
f2 = show_user_menu
f3 = view_file
f4 = edit_file
f5 = copy_items
f6 = move_items
f7 = make_directory
f8 = delete_items
delete = delete_items
f9 = toggle_menu_bar
f10 = quit_app

[selection]
insert = toggle_selection
space = toggle_selection
+ = select_by_wildcard
- = deselect_by_wildcard
* = invert_selection
alt++ = select_all_same_ext
ctrl+r = refresh_view
ctrl+u = swap_panes
ctrl+o = toggle_split_orientation

[tabs]
ctrl+t = new_tab
ctrl+w = close_tab
ctrl+pgup = prev_tab
ctrl+pgdn = next_tab
ctrl+l = lock_tab

[features]
alt+f7 = find_files
ctrl+f = quick_filter
ctrl+d = show_bookmarks
ctrl+g = go_to_path
ctrl+s = sync_directories
ctrl+q = toggle_quick_view
ctrl+i = toggle_info_panel
ctrl+m = show_mounts
ctrl+e = compare_directories
